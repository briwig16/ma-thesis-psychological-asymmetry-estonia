<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EIM — Deviation from Unweighted Group Midpoint</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0c12; display:flex; justify-content:center; padding:36px 24px 48px; font-family:'Segoe UI',system-ui,sans-serif; }
#wrap { width:1300px; }
svg { display:block; }
#tooltip {
  position:fixed; display:none;
  background:rgba(12,14,20,0.97); border:1px solid rgba(255,255,255,0.13);
  border-radius:10px; padding:13px 16px; pointer-events:none; max-width:340px;
  box-shadow:0 6px 28px rgba(0,0,0,0.6); z-index:100;
  font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; color:#cbd5e1; line-height:1.6;
}
#tooltip .tt-title { font-size:13px; font-weight:700; margin-bottom:8px; }
#tooltip .tt-row { display:flex; justify-content:space-between; gap:24px; font-size:11px; margin-bottom:3px; }
#tooltip .tt-label { color:#64748b; }
#tooltip .tt-val { font-weight:600; }
#tooltip .tt-divider { border-top:1px solid rgba(255,255,255,0.08); margin:7px 0; }
#tooltip .tt-note { font-size:11px; color:#94a3b8; font-style:italic; }
</style>
</head>
<body>
<div id="wrap"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="tooltip"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');

// ── Layout constants ────────────────────────────────────────────────────────
const W = 1300, ROW_H = 90, N_ROWS = 10;
const ML = 240, MR = 140, MT = 152, MB = 55;
const CW = W - ML - MR;
const H  = MT + N_ROWS * ROW_H + MB;

svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('width',  W);
svg.setAttribute('height', H);

const EST  = '#60a5fa';   // blue — Estonian
const RUS  = '#facc15';   // yellow — Russian
const GI_BG = 'rgba(6,182,212,0.038)';
const SC_BG = 'rgba(168,85,247,0.038)';

// ── Sample sizes (kept for tooltip reference) ──────────────────────────────
const N_EST_23 = 870, N_RUS_23 = 522;
const N_EST_20 = 706, N_RUS_20 = 609;

// ── Data (same inverted-scale means as dumbbell, sorted by 2023 |d| desc) ──
const raw = [
  {
    name:'Contact: Russian Speakers', group:'gi',
    scaleMin:1, scaleMax:5,
    note:'Higher = more frequent contact with Russian speakers (inverted)',
    description:'Measures how frequently respondents interact with Russian-speaking people across six everyday social contexts. For Estonians this captures cross-group contact; for Russians it captures in-group contact.',
    est20:2.02, rus20:4.21, est23:2.13, rus23:4.29,
    d23:2.25, sig23:'***'
  },
  {
    name:'Contact: Estonian Speakers', group:'gi',
    note:'Higher = more frequent contact with Estonian speakers (inverted)',
    description:'Measures how frequently respondents interact with Estonian-speaking people across six everyday social contexts. For Russian speakers this captures cross-group contact; for Estonians it captures in-group contact.',
    est20:4.15, rus20:2.14, est23:4.26, rus23:2.71,
    d23:1.57, sig23:'***'
  },
  {
    name:'Social Distance: Primary Out-group', group:'gi',
    note:'Higher = more preferred social distance toward the primary out-group',
    description:'Measures the preferred social distance from the primary ethno-linguistic out-group: Russian speakers (for Estonians) or Estonian speakers (for Russians), across three social contexts.',
    est20:2.51, rus20:1.90, est23:2.91, rus23:1.83,
    d23:1.18, sig23:'***'
  },
  {
    name:'Minority Support Inclusion', group:'sc',
    note:'Higher = stronger support for minority inclusion in governance (inverted)',
    description:'Measures support for the meaningful participation of non-Estonian residents in Estonia\'s economic and political decision-making.',
    est20:2.79, rus20:3.43, est23:2.67, rus23:3.46,
    d23:1.14, sig23:'***'
  },
  {
    name:'Superordinate Identity', group:'gi',
    note:'Higher = stronger sense of belonging to Estonia (inverted)',
    description:'Measures whether respondents feel they belong to and are accepted by Estonian society — capturing flag pride, perceived equality of status, and felt inclusion.',
    est20:3.55, rus20:2.92, est23:3.50, rus23:2.95,
    d23:0.79, sig23:'***'
  },
  {
    name:'Belief in Inevitable Conflict', group:'sc',
    note:'Higher = stronger belief that ethnic conflict is inevitable',
    description:'Measures the degree to which respondents believe ethnic and cultural differences in Estonia inevitably produce social conflict and division rather than cooperation.',
    est20:2.78, rus20:3.03, est23:2.72, rus23:3.21,
    d23:0.78, sig23:'***'
  },
  {
    name:'Comparative Opportunity Assessment', group:'sc',
    note:'Higher = perceives greater Estonian structural advantage (inverted)',
    description:'Asks whether opportunities are BETTER FOR ESTONIANS or better for other nationalities — NOT a general satisfaction rating.',
    est20:2.44, rus20:2.86, est23:2.29, rus23:2.68,
    d23:0.74, sig23:'***'
  },
  {
    name:'Group ID Patterns', group:'gi',
    note:'Higher = identifies more with Estonian people than own ethnic group',
    description:'Single item measuring dual identity: respondents place themselves on a spectrum from identifying only with their own ethnic group (1) to identifying only with the Estonian people (5).',
    est20:2.95, rus20:2.69, est23:2.94, rus23:2.81,
    d23:0.15, sig23:'**'
  },
  {
    name:'Social Distance: General Out-group', group:'gi',
    note:'Higher = more preferred social distance toward Europeans & non-Europeans',
    description:'Measures the preferred social distance from general out-groups — other Europeans and people from outside Europe — across the same three social contexts.',
    est20:2.91, rus20:3.12, est23:2.70, rus23:2.60,
    d23:0.11, sig23:'*'
  },
  {
    name:'Territorial Attachment', group:'sc',
    note:'Higher = stronger feeling of being at home in Estonia (inverted)',
    description:'Single item measuring whether respondents feel more at home in Estonia than anywhere else in the world.',
    est20:3.76, rus20:3.57, est23:3.77, rus23:3.73,
    d23:0.09, sig23:'ns'
  }
];

// ── Compute unweighted midpoints & deviations ───────────────────────────────
const data = raw.map(c => {
  const mid23 = (c.est23 + c.rus23) / 2;
  const mid20 = (c.est20 + c.rus20) / 2;
  return {
    ...c,
    mid23, mid20,
    estDev23: c.est23 - mid23,
    rusDev23: c.rus23 - mid23,
    estDev20: c.est20 - mid20,
    rusDev20: c.rus20 - mid20
  };
});

// ── Axis range (symmetric, based on max absolute deviation) ─────────────────
let maxDev = 0;
data.forEach(c => {
  maxDev = Math.max(maxDev, Math.abs(c.estDev23), Math.abs(c.rusDev23),
                             Math.abs(c.estDev20), Math.abs(c.rusDev20));
});
maxDev = Math.ceil(maxDev * 10) / 10 + 0.1;  // pad slightly

// ── Helpers ─────────────────────────────────────────────────────────────────
function el(tag, attrs={}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}
function xp(dev) { return ML + CW/2 + (dev / maxDev) * (CW/2); }
const centerX = ML + CW/2;

// ── Background ──────────────────────────────────────────────────────────────
svg.appendChild(el('rect', {x:0, y:0, width:W, height:H, fill:'#0a0c12'}));

// ── Title & subtitle ────────────────────────────────────────────────────────
svg.appendChild(el('text', {
  x:W/2, y:34, 'text-anchor':'middle',
  fill:'#f1f5f9', 'font-size':'20', 'font-weight':'700', 'letter-spacing':'0.3'
}, 'Deviation from Unweighted Group Midpoint — EIM 2020 & 2023'));

svg.appendChild(el('text', {
  x:W/2, y:54, 'text-anchor':'middle',
  fill:'#64748b', 'font-size':'11.5', 'letter-spacing':'0.2'
}, 'How far each group sits from the unweighted midpoint of both group means | Sorted by 2023 Cohen\'s d'));

// ── Legend ───────────────────────────────────────────────────────────────────
const legY = 76;
const legStartX = 28;

// Group category key
[
  { color:'#06b6d4', label:'Group Interactions', x: legStartX },
  { color:'#a855f7', label:'Interactions with Society', x: legStartX + 126 }
].forEach(({color, label, x}) => {
  svg.appendChild(el('rect', { x:x, y:legY-7, width:3.5, height:14, rx:1.5, fill:color, 'fill-opacity':'0.8' }));
  svg.appendChild(el('text', { x:x+10, y:legY+4, fill:color, 'font-size':'11', 'fill-opacity':'0.85' }, label));
});

// Estonian / Russian
const erX = legStartX + 290;
[
  { color:EST, label:'Estonian respondents' },
  { color:RUS, label:'Russian respondents'  }
].forEach(({color, label}, i) => {
  const lx = erX + i * 195;
  svg.appendChild(el('circle', { cx:lx+7,  cy:legY, r:5, fill:color, 'fill-opacity':'0.3', stroke:color, 'stroke-width':'1.5', 'stroke-opacity':'0.55' }));
  svg.appendChild(el('circle', { cx:lx+23, cy:legY, r:8, fill:color }));
  svg.appendChild(el('text', { x:lx+37, y:legY+4, fill:'#94a3b8', 'font-size':'12' }, label));
});

// Year key
const ykX = erX + 420;
svg.appendChild(el('circle', { cx:ykX,    cy:legY, r:5,  fill:'#334155', stroke:'#64748b', 'stroke-width':'1.5' }));
svg.appendChild(el('text',   { x:ykX+13,  y:legY+4, fill:'#64748b', 'font-size':'11' }, 'Faded = 2020'));
svg.appendChild(el('circle', { cx:ykX+108, cy:legY, r:8, fill:'#94a3b8' }));
svg.appendChild(el('text',   { x:ykX+121, y:legY+4, fill:'#94a3b8', 'font-size':'11' }, 'Solid = 2023'));

// Second legend row — interpretation
const pvY = legY + 22;
svg.appendChild(el('text', { x:legStartX, y:pvY+4, fill:'#475569', 'font-size':'10', 'font-weight':'700', 'letter-spacing':'0.5' }, 'READING:'));
svg.appendChild(el('text', { x:legStartX + 68, y:pvY+4, fill:'#64748b', 'font-size':'10.5' },
  'Center line = unweighted midpoint of Estonian & Russian group means. Bars show raw scale-point deviation (always symmetric).'));

// ── Column headers ──────────────────────────────────────────────────────────
const varColCenter = (12 + ML - 16) / 2;
svg.appendChild(el('text', { x:varColCenter, y:MT-20, 'text-anchor':'middle', fill:'#94a3b8', 'font-size':'11', 'font-weight':'700', 'letter-spacing':'0.8' }, 'VARIABLE'));
svg.appendChild(el('text', { x:varColCenter, y:MT-8, 'text-anchor':'middle', fill:'#64748b', 'font-size':'9.5', 'font-style':'italic' }, 'hover for details'));

// Right column header
const rhX = W - MR + 16;
svg.appendChild(el('text', { x:rhX+40, y:MT-20, 'text-anchor':'middle', fill:'#94a3b8', 'font-size':'11', 'font-weight':'700', 'letter-spacing':'0.8' }, 'MIDPOINT'));
svg.appendChild(el('text', { x:rhX+5, y:MT-7, fill:'#334155', 'font-size':'9.5' }, '2020'));
svg.appendChild(el('text', { x:rhX+55, y:MT-7, fill:'#475569', 'font-size':'9.5' }, '2023'));

// ── Center line & grid ──────────────────────────────────────────────────────
// Center line (weighted mean = 0)
svg.appendChild(el('line', {
  x1:centerX, y1:MT-6, x2:centerX, y2:MT + N_ROWS*ROW_H + 6,
  stroke:'rgba(255,255,255,0.22)', 'stroke-width':'1.5'
}));

// Symmetric grid lines
const gridSteps = [0.25, 0.5, 0.75, 1.0, 1.25];
gridSteps.forEach(step => {
  if (step > maxDev) return;
  const isMajor = (step === 0.5 || step === 1.0);
  [-1, 1].forEach(dir => {
    svg.appendChild(el('line', {
      x1:xp(step*dir), y1:MT-6, x2:xp(step*dir), y2:MT + N_ROWS*ROW_H + 6,
      stroke: isMajor ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.035)',
      'stroke-width': isMajor ? 1.2 : 0.8,
      'stroke-dasharray': isMajor ? '4 4' : '2 4'
    }));
  });
});

// ── X-axis labels ────────────────────────────────────────────────────────────
const axY = MT + N_ROWS * ROW_H + 18;

// Center label
svg.appendChild(el('text', { x:centerX, y:axY+10, 'text-anchor':'middle', fill:'#64748b', 'font-size':'10', 'font-weight':'600' }, '0'));
svg.appendChild(el('text', { x:centerX, y:axY+22, 'text-anchor':'middle', fill:'#334155', 'font-size':'9' }, 'midpoint'));

// Deviation labels
gridSteps.forEach(step => {
  if (step > maxDev) return;
  svg.appendChild(el('text', { x:xp(-step), y:axY+10, 'text-anchor':'middle', fill:'#334155', 'font-size':'10' }, '−'+step.toFixed(step < 1 ? 2 : 1)));
  svg.appendChild(el('text', { x:xp(+step), y:axY+10, 'text-anchor':'middle', fill:'#334155', 'font-size':'10' }, '+'+step.toFixed(step < 1 ? 2 : 1)));
});

// Direction labels
svg.appendChild(el('text', { x:ML+14, y:axY+10, fill:'#475569', 'font-size':'10', 'font-weight':'600' }, '◄ below mean'));
svg.appendChild(el('text', { x:ML+CW-14, y:axY+10, 'text-anchor':'end', fill:'#475569', 'font-size':'10', 'font-weight':'600' }, 'above mean ►'));

// ── Rows ─────────────────────────────────────────────────────────────────────
data.forEach((c, i) => {
  const rowY  = MT + i * ROW_H;
  const midY  = rowY + ROW_H / 2;
  const y20   = midY - 16;   // 2020 track (ghost)
  const y23   = midY + 14;   // 2023 track (primary)

  // Row background
  svg.appendChild(el('rect', {
    x:0, y:rowY, width:W, height:ROW_H,
    fill: c.group === 'gi' ? GI_BG : SC_BG
  }));

  // Row separator
  if (i > 0) svg.appendChild(el('line', {
    x1:0, y1:rowY, x2:W, y2:rowY,
    stroke:'rgba(255,255,255,0.045)', 'stroke-width':'1'
  }));

  // Group colour bar
  const tagColor = c.group === 'gi' ? '#06b6d4' : '#a855f7';
  svg.appendChild(el('rect', { x:4, y:rowY+5, width:3, height:ROW_H-10, rx:1.5, fill:tagColor, 'fill-opacity':'0.7' }));

  // ── Left column: variable name + note ──────────────────────────────────
  let nameLine1, nameLine2;
  if (c.name.includes(': ')) {
    nameLine1 = c.name.split(': ')[0] + ':';
    nameLine2 = c.name.split(': ').slice(1).join(': ');
  } else if (c.name.length > 24) {
    const mid = Math.floor(c.name.length / 2);
    const spaceAfter = c.name.indexOf(' ', mid);
    const spaceBefore = c.name.lastIndexOf(' ', mid);
    const split = (spaceAfter !== -1 && spaceAfter - mid < mid - spaceBefore) ? spaceAfter : spaceBefore;
    nameLine1 = c.name.substring(0, split);
    nameLine2 = c.name.substring(split + 1);
  } else {
    nameLine1 = c.name;
    nameLine2 = null;
  }

  const nameY1 = midY - (nameLine2 ? 4 : 0);
  const nameG = el('g', { style:'cursor:pointer' });
  nameG.appendChild(el('rect', { x:12, y:rowY+2, width:ML-28, height:ROW_H-4, fill:'transparent' }));

  nameG.appendChild(el('text', {
    x:ML-16, y:nameY1,
    'text-anchor':'end', fill:'#ffffff', 'font-size':'12.5', 'font-weight':'600'
  }, nameLine1));
  if (nameLine2) nameG.appendChild(el('text', {
    x:ML-16, y:nameY1+16,
    'text-anchor':'end', fill:'#ffffff', 'font-size':'12.5', 'font-weight':'600'
  }, nameLine2));

  // Scale note
  const noteBaseY = (nameLine2 ? nameY1+16 : nameY1) + 15;
  const noteMaxChars = 38;
  if (c.note.length > noteMaxChars) {
    const nMid = Math.floor(c.note.length / 2);
    const nAfter = c.note.indexOf(' ', nMid);
    const nBefore = c.note.lastIndexOf(' ', nMid);
    const nSplit = (nAfter !== -1 && nAfter - nMid < nMid - nBefore) ? nAfter : nBefore;
    nameG.appendChild(el('text', { x:ML-16, y:noteBaseY, 'text-anchor':'end', fill:'#94a3b8', 'font-size':'9', 'font-style':'italic' }, c.note.substring(0, nSplit)));
    nameG.appendChild(el('text', { x:ML-16, y:noteBaseY+11, 'text-anchor':'end', fill:'#94a3b8', 'font-size':'9', 'font-style':'italic' }, c.note.substring(nSplit + 1)));
  } else {
    nameG.appendChild(el('text', { x:ML-16, y:noteBaseY, 'text-anchor':'end', fill:'#94a3b8', 'font-size':'9', 'font-style':'italic' }, c.note));
  }

  addNameTooltip(nameG, c);
  svg.appendChild(nameG);

  // ── 2020 lollipops (ghost) ──────────────────────────────────────────────

  // Estonian 2020
  const e20x = xp(c.estDev20);
  svg.appendChild(el('line', {
    x1:centerX, y1:y20, x2:e20x, y2:y20,
    stroke:EST, 'stroke-width':'2', 'stroke-opacity':'0.18'
  }));
  const eg20 = el('g', { style:'cursor:pointer' });
  eg20.appendChild(el('circle', { cx:e20x, cy:y20, r:5.5, fill:EST, 'fill-opacity':'0.25', stroke:EST, 'stroke-width':'1.5', 'stroke-opacity':'0.45' }));
  addDotTooltip(eg20, c, '2020', 'Estonian', c.est20, c.estDev20, c.mid20, e20x, y20, EST);
  svg.appendChild(eg20);

  // Russian 2020
  const r20x = xp(c.rusDev20);
  svg.appendChild(el('line', {
    x1:centerX, y1:y20, x2:r20x, y2:y20,
    stroke:RUS, 'stroke-width':'2', 'stroke-opacity':'0.18'
  }));
  const rg20 = el('g', { style:'cursor:pointer' });
  rg20.appendChild(el('circle', { cx:r20x, cy:y20, r:5.5, fill:RUS, 'fill-opacity':'0.25', stroke:RUS, 'stroke-width':'1.5', 'stroke-opacity':'0.45' }));
  addDotTooltip(rg20, c, '2020', 'Russian', c.rus20, c.rusDev20, c.mid20, r20x, y20, RUS);
  svg.appendChild(rg20);

  // Faded deviation labels for 2020
  svg.appendChild(el('text', { x:e20x, y:y20-9, 'text-anchor':'middle', fill:EST, 'font-size':'9', 'fill-opacity':'0.35' },
    (c.estDev20 >= 0 ? '+' : '') + c.estDev20.toFixed(2)));
  svg.appendChild(el('text', { x:r20x, y:y20-9, 'text-anchor':'middle', fill:RUS, 'font-size':'9', 'fill-opacity':'0.35' },
    (c.rusDev20 >= 0 ? '+' : '') + c.rusDev20.toFixed(2)));

  // ── 2023 lollipops (primary) ────────────────────────────────────────────

  // Estonian 2023
  const e23x = xp(c.estDev23);
  svg.appendChild(el('line', {
    x1:centerX, y1:y23, x2:e23x, y2:y23,
    stroke:EST, 'stroke-width':'4', 'stroke-opacity':'0.5'
  }));
  const eg23 = el('g', { style:'cursor:pointer' });
  eg23.appendChild(el('circle', { cx:e23x, cy:y23, r:10, fill:EST }));
  eg23.appendChild(el('text', { x:e23x, y:y23+3.5, 'text-anchor':'middle', fill:'#0a0c12', 'font-size':'9', 'font-weight':'800' }, 'E'));
  addDotTooltip(eg23, c, '2023', 'Estonian', c.est23, c.estDev23, c.mid23, e23x, y23, EST);
  svg.appendChild(eg23);
  // Label
  svg.appendChild(el('text', { x:e23x, y:y23+24, 'text-anchor':'middle', fill:EST, 'font-size':'10.5', 'font-weight':'700' },
    (c.estDev23 >= 0 ? '+' : '') + c.estDev23.toFixed(2)));

  // Russian 2023
  const r23x = xp(c.rusDev23);
  svg.appendChild(el('line', {
    x1:centerX, y1:y23, x2:r23x, y2:y23,
    stroke:RUS, 'stroke-width':'4', 'stroke-opacity':'0.5'
  }));
  const rg23 = el('g', { style:'cursor:pointer' });
  rg23.appendChild(el('circle', { cx:r23x, cy:y23, r:10, fill:RUS }));
  rg23.appendChild(el('text', { x:r23x, y:y23+3.5, 'text-anchor':'middle', fill:'#0a0c12', 'font-size':'9', 'font-weight':'800' }, 'R'));
  addDotTooltip(rg23, c, '2023', 'Russian', c.rus23, c.rusDev23, c.mid23, r23x, y23, RUS);
  svg.appendChild(rg23);
  // Label
  svg.appendChild(el('text', { x:r23x, y:y23+24, 'text-anchor':'middle', fill:RUS, 'font-size':'10.5', 'font-weight':'700' },
    (c.rusDev23 >= 0 ? '+' : '') + c.rusDev23.toFixed(2)));

  // ── Right column: weighted means ────────────────────────────────────────
  svg.appendChild(el('text', { x:rhX+5, y:midY+5, fill:'#334155', 'font-size':'12.5' }, c.mid20.toFixed(2)));
  svg.appendChild(el('text', { x:rhX+55, y:midY+5, fill:'#e2e8f0', 'font-size':'13', 'font-weight':'700' }, c.mid23.toFixed(2)));
});

// ── Footer ──────────────────────────────────────────────────────────────────
svg.appendChild(el('text', {
  x:W/2, y:H-10, 'text-anchor':'middle',
  fill:'#1e293b', 'font-size':'10'
}, 'Estonian Integration Monitor (EIM) — Deviation from Unweighted Group Midpoint | Center = (Estonian mean + Russian mean) / 2'));

// ── Tooltip logic ────────────────────────────────────────────────────────────
function addDotTooltip(g, comp, year, group, rawVal, dev, wm, dotX, dotY, color) {
  const isEst = group === 'Estonian';
  const peerDev = isEst ? (year==='2023' ? comp.rusDev23 : comp.rusDev20) : (year==='2023' ? comp.estDev23 : comp.estDev20);
  const peerRaw = isEst ? (year==='2023' ? comp.rus23 : comp.rus20) : (year==='2023' ? comp.est23 : comp.est20);
  const peerLbl = isEst ? 'Russian' : 'Estonian';
  const nEst = year==='2023' ? N_EST_23 : N_EST_20;
  const nRus = year==='2023' ? N_RUS_23 : N_RUS_20;

  g.addEventListener('mouseenter', () => {
    tooltip.innerHTML = `
      <div class="tt-title" style="color:${color}">${group} — ${comp.name} (${year})</div>
      <div class="tt-row"><span class="tt-label">${group} mean:</span><span class="tt-val" style="color:${color}">${rawVal.toFixed(2)}</span></div>
      <div class="tt-row"><span class="tt-label">${peerLbl} mean:</span><span class="tt-val">${peerRaw.toFixed(2)}</span></div>
      <div class="tt-divider"></div>
      <div class="tt-row"><span class="tt-label">Midpoint:</span><span class="tt-val">${wm.toFixed(3)}</span></div>
      <div class="tt-row"><span class="tt-label">${group} deviation:</span><span class="tt-val" style="color:${color}">${(dev >= 0 ? '+' : '')}${dev.toFixed(3)}</span></div>
      <div class="tt-row"><span class="tt-label">${peerLbl} deviation:</span><span class="tt-val">${(peerDev >= 0 ? '+' : '')}${peerDev.toFixed(3)}</span></div>
      <div class="tt-divider"></div>
      <div class="tt-row"><span class="tt-label">Sample N:</span><span class="tt-val">Est N=${nEst}, Rus N=${nRus}</span></div>
      <div class="tt-divider"></div>
      <div class="tt-note">${comp.note}</div>
    `;
    tooltip.style.display = 'block';
  });
  g.addEventListener('mousemove', e => {
    let tx = e.clientX + 14, ty = e.clientY - 12;
    if (tx + 350 > window.innerWidth)  tx = e.clientX - 364;
    if (ty + 300 > window.innerHeight) ty = e.clientY - 300;
    tooltip.style.left = tx+'px';
    tooltip.style.top  = ty+'px';
  });
  g.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

function addNameTooltip(g, comp) {
  const tagColor = comp.group === 'gi' ? '#06b6d4' : '#a855f7';
  const groupLabel = comp.group === 'gi' ? 'Group Interactions' : 'Interactions with Society';
  g.addEventListener('mouseenter', () => {
    tooltip.innerHTML = `
      <div class="tt-title" style="color:${tagColor}">${comp.name}</div>
      <div style="color:#64748b;font-size:10px;margin-bottom:6px;">${groupLabel}</div>
      <div style="color:#e2e8f0;font-size:12px;line-height:1.5;margin-bottom:10px;">${comp.description}</div>
      <div class="tt-divider"></div>
      <div class="tt-row"><span class="tt-label">2023 midpoint:</span><span class="tt-val">${comp.wm23.toFixed(3)}</span></div>
      <div class="tt-row"><span class="tt-label">2020 midpoint:</span><span class="tt-val">${comp.wm20.toFixed(3)}</span></div>
      <div class="tt-divider"></div>
      <div class="tt-note">${comp.note}</div>
    `;
    tooltip.style.display = 'block';
  });
  g.addEventListener('mousemove', e => {
    let tx = e.clientX + 14, ty = e.clientY - 12;
    if (tx + 370 > window.innerWidth)  tx = e.clientX - 384;
    if (ty + 350 > window.innerHeight) ty = e.clientY - 350;
    tooltip.style.left = tx+'px';
    tooltip.style.top  = ty+'px';
  });
  g.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}
</script>
